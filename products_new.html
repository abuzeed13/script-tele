<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات المحسنة - نظام متعدد السيرفرات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B6B, #4ECDC4, #45B7D1, #96CEB4);
        }

        .server-selector {
            background: #f8f9fa;
            padding: 25px 30px;
            border-bottom: 2px solid #e9ecef;
        }

        .server-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .server-tab {
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            min-width: 200px;
            text-align: center;
        }

        .server-tab:hover {
            border-color: #4CAF50;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .server-tab.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .server-tab.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .server-tab .server-name {
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .server-tab .server-status {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .loading-indicator {
            display: none;
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .loading-indicator.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-bar {
            background: #f8f9fa;
            padding: 20px;
            margin: 20px 30px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            display: none;
        }

        .stats-bar.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9em;
        }

        .products-container {
            min-height: 400px;
            padding: 30px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e3e6ea;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4CAF50, #45a049);
        }

        .product-card.unavailable::before {
            background: linear-gradient(90deg, #dc3545, #c82333);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .product-card.unavailable {
            opacity: 0.7;
            background: #f8f9fa;
        }

        .product-header {
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .product-card.unavailable .product-title {
            color: #6c757d;
        }

        .product-type {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .unavailable-badge {
            background: #f8d7da;
            color: #721c24;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            border: 1px solid #f5c6cb;
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .product-details {
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .detail-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.95em;
        }

        .detail-value {
            color: #6c757d;
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }

        .product-card.unavailable .detail-value {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-unavailable {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .product-card.unavailable .product-actions {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #1e7e34;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #c82333;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #495057;
        }

        .server-error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }

        .refresh-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: #138496;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .server-tabs {
                flex-direction: column;
            }

            .server-tab {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>نظام إدارة المنتجات المتقدم</h1>
            <p>إدارة حسابات PPP و Hotspot عبر عدة سيرفرات</p>
        </div>

        <div class="server-selector">
            <h3 style="margin-bottom: 15px; color: #495057;">اختر السيرفر:</h3>
            <div class="server-tabs">
                <div class="server-tab active" data-server="server1">
                    <div class="server-name">السيرفر الأول</div>
                    <div class="server-status">RouterOS 6.44.3 - RB1100Dx4</div>
                </div>
                <div class="server-tab" data-server="server2">
                    <div class="server-name">السيرفر الثاني</div>
                    <div class="server-status">RouterOS 6.46 - RB951G-2HnD</div>
                </div>
                <div class="server-tab" data-server="server3">
                    <div class="server-name">السيرفر الثالث</div>
                    <div class="server-status">RouterOS 7.1 - CCR1009</div>
                </div>
            </div>
        </div>

        <div class="loading-indicator" id="loadingIndicator">
            <div class="loading-spinner"></div>
            <div>جاري تحميل بيانات السيرفر...</div>
        </div>

        <div class="stats-bar show" id="statsBar">
            <div class="stats-grid" id="statsGrid">
                <!-- سيتم ملء الإحصائيات ديناميكياً -->
            </div>
        </div>

        <div class="products-container" id="productsContainer">
            <div class="products-grid" id="productsGrid">
                <!-- سيتم ملء المنتجات ديناميكياً -->
            </div>
        </div>
    </div>

    <script>
        // بيانات السيرفرات (محاكاة)
        const serversData = {
            server1: {
                name: "السيرفر الأول",
                status: "متصل",
                stats: {
                    totalPPP: 24,
                    activePPP: 18,
                    totalHotspot: 12,
                    activeHotspot: 8
                },
                products: [
                    {
                        id: 1,
                        title: "حساب PPP - زيد",
                        type: "PPPoE",
                        username: "zeed",
                        password: "123456",
                        profile: "512K",
                        status: "active",
                        uptime: "2h 15m",
                        available: true
                    },
                    {
                        id: 2,
                        title: "حساب Hotspot - أحمد",
                        type: "Hotspot",
                        username: "ahmed",
                        password: "pass123",
                        profile: "1M",
                        status: "active",
                        usage: "245 MB",
                        available: true
                    },
                    {
                        id: 3,
                        title: "حساب PPP - محمد",
                        type: "PPPoE",
                        username: "mohammed",
                        password: "mypass",
                        profile: "256K",
                        status: "inactive",
                        lastSeen: "منذ 3 أيام",
                        available: true
                    },
                    {
                        id: 4,
                        title: "حساب Hotspot - سارة",
                        type: "Hotspot",
                        username: "sara",
                        password: "sara2023",
                        profile: "2M",
                        status: "active",
                        usage: "1.2 GB",
                        available: true
                    }
                ]
            },
            server2: {
                name: "السيرفر الثاني",
                status: "متصل",
                stats: {
                    totalPPP: 18,
                    activePPP: 12,
                    totalHotspot: 8,
                    activeHotspot: 5
                },
                products: [
                    {
                        id: 5,
                        title: "حساب PPP - علي",
                        type: "PPPoE",
                        username: "ali",
                        password: "ali123",
                        profile: "1M",
                        status: "active",
                        uptime: "4h 32m",
                        available: true
                    },
                    {
                        id: 6,
                        title: "حساب PPP - فاطمة",
                        type: "PPPoE",
                        username: "fatima",
                        password: "fatima456",
                        profile: "512K",
                        status: "inactive",
                        lastSeen: "منذ يوم واحد",
                        available: false
                    },
                    {
                        id: 7,
                        title: "حساب Hotspot - خالد",
                        type: "Hotspot",
                        username: "khaled",
                        password: "khaled789",
                        profile: "2M",
                        status: "active",
                        usage: "856 MB",
                        available: false
                    },
                    {
                        id: 8,
                        title: "حساب PPP - ليلى",
                        type: "PPPoE",
                        username: "layla",
                        password: "layla321",
                        profile: "1M",
                        status: "active",
                        uptime: "1h 45m",
                        available: true
                    }
                ]
            },
            server3: {
                name: "السيرفر الثالث",
                status: "خطأ في الاتصال",
                error: "فشل في الاتصال مع السيرفر",
                stats: null,
                products: []
            }
        };

        let currentServer = 'server1';
        let loadedServers = new Set(['server1']); // السيرفر الأول محمل افتراضياً

        // تحميل بيانات السيرفر الأول عند بدء التشغيل
        document.addEventListener('DOMContentLoaded', function() {
            loadServerData('server1');
        });

        // معالج النقر على تبويبات السيرفرات
        document.querySelectorAll('.server-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const serverId = this.dataset.server;
                if (serverId !== currentServer) {
                    switchServer(serverId);
                }
            });
        });

        function switchServer(serverId) {
            currentServer = serverId;
            
            // تحديث التبويبات النشطة
            document.querySelectorAll('.server-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-server="${serverId}"]`).classList.add('active');

            // تحقق من وجود البيانات المحملة مسبقاً
            if (loadedServers.has(serverId)) {
                loadServerData(serverId);
            } else {
                loadServerDataAsync(serverId);
            }
        }

        function loadServerDataAsync(serverId) {
            showLoading();
            hideStats();
            hideProducts();
            
            // محاكاة تحميل البيانات
            setTimeout(() => {
                loadedServers.add(serverId);
                loadServerData(serverId);
                hideLoading();
            }, 2000); // تأخير لمحاكاة التحميل
        }

        function loadServerData(serverId) {
            const serverData = serversData[serverId];
            
            if (serverData.error) {
                showServerError(serverData.error, serverId);
                return;
            }

            updateStats(serverData.stats);
            updateProducts(serverData.products);
            showStats();
            showProducts();
        }

        function updateStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number">${stats.totalPPP}</div>
                    <div class="stat-label">إجمالي حسابات PPP</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${stats.activePPP}</div>
                    <div class="stat-label">حسابات PPP نشطة</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${stats.totalHotspot}</div>
                    <div class="stat-label">حسابات Hotspot</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">${stats.activeHotspot}</div>
                    <div class="stat-label">Hotspot متصل</div>
                </div>
            `;
        }

        function updateProducts(products) {
            const productsGrid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                productsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <h3>لا توجد منتجات</h3>
                        <p>لم يتم العثور على أي منتجات في هذا السيرفر</p>
                    </div>
                `;
                return;
            }

            productsGrid.innerHTML = products.map(product => {
                const statusClass = product.status === 'active' ? 'status-active' : 
                                   !product.available ? 'status-unavailable' : 'status-inactive';
                const statusText = !product.available ? 'غير متوفر' : 
                                  product.status === 'active' ? 'نشط' : 'معطل';

                return `
                    <div class="product-card ${!product.available ? 'unavailable' : ''}">
                        ${!product.available ? '<div class="unavailable-badge">غير متوفر</div>' : ''}
                        <div class="product-header">
                            <div>
                                <div class="product-title">${product.title}</div>
                                <span class="product-type">${product.type}</span>
                            </div>
                        </div>
                        <div class="product-details">
                            <div class="detail-row">
                                <span class="detail-label">اسم المستخدم:</span>
                                <span class="detail-value">${product.username}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">كلمة المرور:</span>
                                <span class="detail-value">${product.password}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">البروفايل:</span>
                                <span class="detail-value">${product.profile}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">الحالة:</span>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                            ${product.uptime ? `
                            <div class="detail-row">
                                <span class="detail-label">وقت الاتصال:</span>
                                <span class="detail-value">${product.uptime}</span>
                            </div>
                            ` : ''}
                            ${product.usage ? `
                            <div class="detail-row">
                                <span class="detail-label">الاستخدام:</span>
                                <span class="detail-value">${product.usage}</span>
                            </div>
                            ` : ''}
                            ${product.lastSeen ? `
                            <div class="detail-row">
                                <span class="detail-label">آخر اتصال:</span>
                                <span class="detail-value">${product.lastSeen}</span>
                            </div>
                            ` : ''}
                        </div>
                        <div class="product-actions">
                            <button class="btn btn-success" ${!product.available ? 'disabled' : ''}>تفعيل</button>
                            <button class="btn btn-primary" ${!product.available ? 'disabled' : ''}>تعديل</button>
                            <button class="btn btn-danger" ${!product.available ? 'disabled' : ''}>حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showServerError(errorMessage, serverId) {
            const productsContainer = document.getElementById('productsContainer');
            productsContainer.innerHTML = `
                <div class="server-error">
                    <h3>خطأ في الاتصال</h3>
                    <p>${errorMessage}</p>
                    <button class="refresh-btn" onclick="retryConnection('${serverId}')">إعادة المحاولة</button>
                </div>
            `;
            hideStats();
        }

        function retryConnection(serverId) {
            loadServerDataAsync(serverId);
        }

        function showLoading() {
            document.getElementById('loadingIndicator').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.remove('show');
        }

        function showStats() {
            document.getElementById('statsBar').classList.add('show');
        }

        function hideStats() {
            document.getElementById('statsBar').classList.remove('show');
        }

        function showProducts() {
            document.getElementById('productsContainer').style.display = 'block';
        }

        function hideProducts() {
            document.getElementById('productsContainer').style.display = 'none';
        }
    </script>
</body>
</html>
